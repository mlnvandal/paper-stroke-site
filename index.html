<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Paper Stroke is a paint-by-number app for iPhone and iPad.">
  <title>Paper Stroke</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="wrap" aria-label="Main">
      <a class="brand" href="./" aria-current="page">Paper Stroke</a>
      <a href="privacy.html">Privacy Policy</a>
    </nav>
  </header>
  <main class="wrap">
    <section class="intro" aria-labelledby="title">
      <h1 id="title">Paint by number</h1>
      <p>Choose an illustration and paint its numbered areas with a marker or gel pen. Paper Stroke saves your progress on your device, so you can come back to a painting whenever you like.</p>
    </section>
    <div class="screenshots">
      <figure class="phone">
        <img src="assets/iphone.png" width="1206" height="2622" alt="The Lighthouse illustration on iPhone, with the selected numbered area highlighted on the canvas.">
        <figcaption>iPhone</figcaption>
      </figure>
      <figure class="tablet">
        <img src="assets/ipad.png" width="2064" height="2752" alt="The Sailboat illustration on iPad, with the sun and hull painted and the numbered palette below.">
        <figcaption>iPad</figcaption>
      </figure>
    </div>
  </main>
</body>
</html>
